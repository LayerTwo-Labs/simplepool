# -----------------------------------------------------------------------------
# simplepool — docker-compose orchestration
# -----------------------------------------------------------------------------
# Runs the four simplepool services against a Thunder daemon that lives on
# the host (or wherever THUNDER_RPC_URL points). Bitcoin Core is likewise
# expected to be reachable from the simplepool container.
#
# Directory layout on the operator's box:
#   deploy/docker/
#     ├── docker-compose.yml   (this file)
#     ├── .env                 (copied from .env.example, edited)
#     └── proxy.conf           (copied from repo root proxy.conf.example)
#   data/                      (created on first run — holds shares.db)
#
# Bring the stack up:
#   cd deploy/docker
#   cp .env.example .env && $EDITOR .env
#   cp ../../proxy.conf.example proxy.conf && $EDITOR proxy.conf
#   docker compose up -d --build
#
# The simplepool container uses host networking so miners can reach :3334
# without NAT and so it can talk to bitcoind on 127.0.0.1. dashboard and
# payout use the default bridge and reach Thunder via host.docker.internal.
# -----------------------------------------------------------------------------

services:
  simplepool:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.simplepool
    image: simplepool:latest
    container_name: simplepool
    restart: unless-stopped
    # host mode: miners hit :3334 directly, and bitcoind_url in proxy.conf
    # can point at 127.0.0.1 exactly like the bare-metal deploy.
    network_mode: host
    volumes:
      - ../../data:/data
      - ./proxy.conf:/etc/simplepool/proxy.conf:ro
    stop_grace_period: 15s

  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.dashboard
    image: simplepool-dashboard:latest
    container_name: simplepool-dashboard
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8081}:8081"
    environment:
      PORT: "8081"
      DASHBOARD_BIND: 0.0.0.0
      PROXY_DB_PATH: /data/shares.db
      PUBLIC_STRATUM_URL: ${PUBLIC_STRATUM_URL:-stratum+tcp://<pool-host>:3334}
      THUNDER_RPC_URL: ${THUNDER_RPC_URL:-http://host.docker.internal:6009}
      POOL_THUNDER_RESERVE_ADDRESS: ${POOL_THUNDER_RESERVE_ADDRESS:-}
      ADMIN_USER: ${ADMIN_USER:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # --- Write-action wiring ---
      PAYOUT_ADMIN_URL:   ${PAYOUT_ADMIN_URL:-http://host.docker.internal:9080}
      ENFORCER_GRPC_ADDR: ${ENFORCER_GRPC_ADDR:-host.docker.internal:50051}
      THUNDER_SIDECHAIN_ID: ${THUNDER_SIDECHAIN_ID:-9}
      # --- Slipstream (optional) ---
      # Set SLIPSTREAM_API_URL=http://slipstream:8124 (the compose service
      # below, over the compose network) to show the Slipstream page.
      SLIPSTREAM_API_URL:    ${SLIPSTREAM_API_URL:-}
      PUBLIC_SLIPSTREAM_URL: ${PUBLIC_SLIPSTREAM_URL:-}
    volumes:
      # Dashboard now writes to the deposits table when the operator
      # submits a deposit via /admin. Mount RW.
      - ../../data:/data
    extra_hosts:
      # Linux: makes host.docker.internal resolve to the host gateway.
      # No-op on macOS/Windows where docker adds it natively.
      - "host.docker.internal:host-gateway"
    stop_grace_period: 10s

  payout:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.payout
    image: simplepool-payout:latest
    container_name: simplepool-payout
    restart: unless-stopped
    environment:
      PAYOUT_DB_PATH: /data/shares.db
      THUNDER_RPC_URL: ${THUNDER_RPC_URL:-http://host.docker.internal:6009}
      THUNDER_FROM_ADDRESS: ${THUNDER_FROM_ADDRESS:-}
      PAYOUT_MIN_SATS: ${PAYOUT_MIN_SATS:-10000}
      # Daily batch. Settlement of an already-broadcast batch runs on its
      # own short clock so a payout isn't left uncredited for 24h.
      PAYOUT_INTERVAL_MS: ${PAYOUT_INTERVAL_MS:-86400000}
      PAYOUT_SETTLE_INTERVAL_MS: ${PAYOUT_SETTLE_INTERVAL_MS:-30000}
      PAYOUT_RETRY_INTERVAL_MS: ${PAYOUT_RETRY_INTERVAL_MS:-300000}
      PAYOUT_DRY_RUN: ${PAYOUT_DRY_RUN:-0}
      # Admin HTTP surface — dashboard reaches it at PAYOUT_ADMIN_URL.
      # Bind to 0.0.0.0 (default) so the dashboard container can reach
      # it via host.docker.internal:PAYOUT_ADMIN_PORT.
      PAYOUT_ADMIN_BIND: ${PAYOUT_ADMIN_BIND:-0.0.0.0}
      PAYOUT_ADMIN_PORT: ${PAYOUT_ADMIN_PORT:-9080}
    ports:
      # Expose the admin HTTP for the dashboard to hit. Loopback-only
      # on the host is the sane default.
      - "127.0.0.1:${PAYOUT_ADMIN_PORT:-9080}:9080"
    volumes:
      - ../../data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 30s

  slipstream:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.slipstream
    image: simplepool-slipstream:latest
    container_name: simplepool-slipstream
    restart: unless-stopped
    environment:
      # The pool's bitcoind -- the node the enforcer mirrors its mempool
      # from. Txs are checked and broadcast here. Run it with
      # -acceptnonstdtxn to take non-standard txs (not allowed on mainnet).
      BITCOIND_RPC_URL: ${BITCOIND_RPC_URL:-http://host.docker.internal:8332}
      BITCOIND_RPC_USER: ${BITCOIND_RPC_USER:-}
      BITCOIND_RPC_PASS: ${BITCOIND_RPC_PASS:-}
      # The enforcer's block template server -- the proxy's bitcoind_url.
      # Read only: the template is where the mineable rate comes from.
      ENFORCER_GBT_URL: ${ENFORCER_GBT_URL:-http://host.docker.internal:8122}
      SLIPSTREAM_DB_PATH: /data/slipstream.db
      PROXY_DB_PATH: /data/shares.db
      SLIPSTREAM_BIND: 0.0.0.0
      SLIPSTREAM_PORT: "8124"
      SLIPSTREAM_TRUST_PROXY: ${SLIPSTREAM_TRUST_PROXY:-0}
      SLIPSTREAM_MIN_FEE_RATE: ${SLIPSTREAM_MIN_FEE_RATE:-1}
      POOL_NAME: ${POOL_NAME:-}
      POOL_OPERATOR: ${POOL_OPERATOR:-}
      POOL_CHAIN: ${POOL_CHAIN:-}
      POOL_LOGO: ${POOL_LOGO:-}
      POOL_CONTACT: ${POOL_CONTACT:-}
      PUBLIC_STRATUM_URL: ${PUBLIC_STRATUM_URL:-}
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-}
      PUBLIC_SLIPSTREAM_URL: ${PUBLIC_SLIPSTREAM_URL:-}
    ports:
      # Loopback on the host: publish through nginx, which is also what
      # SLIPSTREAM_TRUST_PROXY=1 assumes sets X-Forwarded-For.
      - "127.0.0.1:${SLIPSTREAM_PORT:-8124}:8124"
    volumes:
      # Writes slipstream.db; reads shares.db.
      - ../../data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 10s

  # Optional: posts pool stats to a Telegram channel. Reads the dashboard's
  # public JSON API only. Start it with `docker compose --profile broadcaster up -d`
  # once TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are set in .env.
  broadcaster:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.broadcaster
    image: simplepool-broadcaster:latest
    container_name: simplepool-broadcaster
    restart: unless-stopped
    profiles: ["broadcaster"]
    depends_on:
      - dashboard
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Container-to-container on the compose network.
      DASHBOARD_URL: http://dashboard:8081
      PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-}
      POOL_NAME: ${POOL_NAME:-}
      BROADCASTER_STATE_PATH: /data/broadcaster.json
      DIGEST_UTC_HOUR: ${DIGEST_UTC_HOUR:-12}
      BROADCASTER_LIVE: ${BROADCASTER_LIVE:-0}
      BROADCASTER_DRY_RUN: ${BROADCASTER_DRY_RUN:-0}
    volumes:
      # Writes only broadcaster.json.
      - ../../data:/data
    stop_grace_period: 10s
