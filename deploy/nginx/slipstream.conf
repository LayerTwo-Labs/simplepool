# slipstream.example — reverse proxy for the simplepool slipstream service.
#
# The service is bound to 127.0.0.1:8124 (see
# deploy/systemd/simplepool-slipstream.service) and keys its per-client
# submission limit on the X-Forwarded-For hop set here. Replace
# slipstream.example with your hostname, then:
#
#   sudo cp deploy/nginx/slipstream.conf /etc/nginx/sites-available/<host>
#   sudo ln -s /etc/nginx/sites-available/<host> /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <host>       # TLS, edits this file in place

server {
    listen 80;
    listen [::]:80;
    server_name slipstream.example;

    # Reuses the dashboard's zone (deploy/nginx/pool-ratelimit.conf) for
    # reads. Submissions have their own, stricter limit inside the service.
    limit_req zone=pool_dash burst=20 nodelay;

    # A raw tx arrives as hex: up to 1MB of tx is 2MB of body.
    client_max_body_size 3m;

    access_log /var/log/nginx/slipstream.example.access.log;
    error_log  /var/log/nginx/slipstream.example.error.log warn;

    location / {
        proxy_pass         http://127.0.0.1:8124;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        # Overwritten, not appended: the service trusts this hop, so the
        # client must not be able to put its own in front of it.
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8124/healthz;
        access_log off;
    }
}
